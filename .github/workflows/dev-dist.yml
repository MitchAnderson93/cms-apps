name: Build development dist release

on:
  push:
    branches: [development]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Install + build
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install
          pnpm --filter react build

      - name: Stage build output
        run: |
          rm -rf /tmp/dist
          mkdir -p /tmp/dist
          cp -R apps/react/dist/. /tmp/dist/

      - name: Publish to dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # create clean orphan branch
          git checkout --orphan dist

          # wipe repo contents safely
          git rm -rf . || true
          git clean -fdx

          # copy ONLY built assets back in
          cp -R /tmp/dist/. .

          git add -A
          git commit -m "dist: ${GITHUB_SHA}"
          git push -f origin dist
