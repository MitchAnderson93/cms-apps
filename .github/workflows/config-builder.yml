name: Build GUI dist

on:
  push:
    branches: [GUI]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install + build
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install
          pnpm turbo run build --filter=config-builder

      - name: Stage build output + stable aliases
        run: |
          rm -rf /tmp/dist
          mkdir -p /tmp/dist
          cp -R apps/config-builder/dist/. /tmp/dist/

      - name: Publish to dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Use config name in branch (e.g., dist-example, dist-production)
          DIST_BRANCH="dist-gui"

          git checkout --orphan $DIST_BRANCH
          git rm -rf . || true
          git clean -fdx

          cp -R /tmp/dist/. .

          git add -A
          git commit -m "dist: ${GITHUB_SHA}"
          git push -f origin $DIST_BRANCH