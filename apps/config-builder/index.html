
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Config Builder - Dev Tool</title>
  <link rel="stylesheet" href="https://qld-gov-au.github.io/qgds-bootstrap5-cdn/v2/latest/css/qld.bootstrap.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
    }

    .builder-grid {
      display: grid;
      grid-template-columns: 300px 1fr 400px;
      gap: 20px;
      height: calc(100vh - 40px);
    }

    .panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--qld-light-grey);
      border-radius: 4px;
      background: white;
    }

    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--qld-light-grey);
      background: var(--qld-default-background-shade);
      font-weight: 600;
      font-size: 18px;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .panel-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--qld-light-grey);
      background: var(--qld-default-background-shade);
    }

    .tree-item {
      padding: 12px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      border: 1px solid var(--qld-light-grey);
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tree-item:hover {
      background: var(--qld-default-background-shade);
    }

    .tree-item.active {
      background: var(--qld-light-action-primary);
      color: white;
    }

    .tree-item-label {
      flex: 1;
    }

    .tree-item-path {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 4px;
    }

    .tree-item.active .tree-item-path {
      opacity: 0.9;
    }

    .component-type-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      margin-bottom: 24px;
    }

    .component-type-btn {
      padding: 12px 16px;
      border: 1px solid var(--qld-light-action-secondary);
      background: white;
      cursor: pointer;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
    }

    .component-type-btn:hover {
      background: var(--qld-default-background-shade);
    }

    .component-type-btn.active {
      background: var(--qld-light-action-primary);
      color: white;
      border-color: var(--qld-light-action-primary);
    }

    .component-item {
      padding: 12px 16px;
      margin-bottom: 8px;
      border: 1px solid var(--qld-light-grey);
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--qld-default-background-shade);
    }

    .component-type {
      display: inline-block;
      padding: 2px 8px;
      background: var(--qld-light-action-secondary);
      color: white;
      border-radius: 3px;
      font-size: 11px;
      margin-right: 8px;
    }

    .json-display {
      background: var(--qld-default-background-shade);
      border: 1px solid var(--qld-light-grey);
      border-radius: 4px;
      padding: 16px;
      overflow: auto;
      max-height: calc(100vh - 300px);
    }

    .json-display pre {
      margin: 0;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--qld-dark-grey-muted);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .btn-close-custom {
      background: transparent;
      border: none;
      font-size: 24px;
      color: var(--qld-notify-warning);
      cursor: pointer;
      padding: 0;
      width: 24px;
      height: 24px;
      line-height: 1;
    }

    .btn-close-custom:hover {
      color: var(--qld-dark-text-text);
    }

    .mb-16 {
      margin-bottom: 16px;
    }

    .mb-24 {
      margin-bottom: 24px;
    }
  </style>

  <div class="builder-grid">
    <!-- Page Tree Panel -->
    <div class="panel">
      <div class="panel-header">Pages</div>
      <div class="panel-body" id="pageList"></div>
      <div class="panel-footer">
        <button class="btn btn-primary w-100" onclick="addNewPage()">+ Add Page</button>
      </div>
    </div>

    <!-- Component Builder Panel -->
    <div class="panel">
      <div class="panel-header">Component Builder</div>
      <div class="panel-body">
        <div id="builderContent">
          <div class="empty-state">
            <div class="empty-state-icon">📄</div>
            <div>Select or create a page to start building</div>
          </div>
        </div>
      </div>
    </div>

    <!-- JSON Output Panel -->
    <div class="panel">
      <div class="panel-header">JSON Output</div>
      <div class="panel-body">
        <div class="alert alert-info mb-24" role="alert">
          <strong>💡 Tip</strong><br>
          Copy this JSON to your config file
        </div>
        <div class="json-display">
          <pre id="jsonOutput">{
  "pages": []
}</pre>
        </div>
      </div>
      <div class="panel-footer">
        <button class="btn btn-secondary w-100" onclick="copyToClipboard()">Copy JSON</button>
      </div>
    </div>
  </div>

  <script>
    // State
    let config = {
      pages: []
    };
    let currentPageIndex = null;
    let selectedComponentType = null;

    // Component type definitions
    const componentTypes = [
      'text', 'html', 'inpage-alert', 'button', 'button-group',
      'image', 'accordion', 'checkbox', 'select', 'questionaire',
      'callout', 'debug-button'
    ];

    // Initialize
    function init() {
      renderPages();
      updateJSON();
    }

    // Page Management
    function addNewPage() {
      const path = prompt('Enter page path (e.g., /my-page):');
      if (!path) return;

      const title = prompt('Enter page title:');
      if (!title) return;

      config.pages.push({
        path: path.startsWith('/') ? path : `/${path}`,
        title: title,
        content: []
      });

      renderPages();
      updateJSON();
      selectPage(config.pages.length - 1);
    }

    function selectPage(index) {
      currentPageIndex = index;
      renderPages();
      renderBuilder();
    }

    function removePage(index, event) {
      event.stopPropagation();
      if (confirm('Delete this page?')) {
        config.pages.splice(index, 1);
        if (currentPageIndex === index) {
          currentPageIndex = null;
        } else if (currentPageIndex > index) {
          currentPageIndex--;
        }
        renderPages();
        renderBuilder();
        updateJSON();
      }
    }

    function renderPages() {
      const pageList = document.getElementById('pageList');
      if (config.pages.length === 0) {
        pageList.innerHTML = '<div class="empty-state">No pages yet</div>';
        return;
      }

      pageList.innerHTML = config.pages.map((page, index) => `
        <div class="tree-item ${currentPageIndex === index ? 'active' : ''}" 
             onclick="selectPage(${index})">
          <div class="tree-item-label">
            <div>${page.title}</div>
            <div class="tree-item-path">${page.path}</div>
          </div>
          <button class="btn-close-custom" onclick="removePage(${index}, event)">×</button>
        </div>
      `).join('');
    }

    // Component Builder
    function renderBuilder() {
      const builderContent = document.getElementById('builderContent');

      if (currentPageIndex === null) {
        builderContent.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📄</div>
            <div>Select or create a page to start building</div>
          </div>
        `;
        return;
      }

      const currentPage = config.pages[currentPageIndex];

      builderContent.innerHTML = `
        <div>
          <h2 class="mb-24">${currentPage.title}</h2>
          
          <label class="qld-text-input-label">Select Component Type</label>
          <div class="component-type-grid mb-24" id="componentTypeSelector"></div>
          
          <div id="componentForm"></div>
          
          ${currentPage.content.length > 0 ? `
            <div style="margin-top: 32px;">
              <label class="qld-text-input-label">Components in this page (${currentPage.content.length})</label>
              <div id="componentsList"></div>
            </div>
          ` : ''}
        </div>
      `;

      renderComponentTypeSelector();
      renderComponentsList();
    }

    function renderComponentTypeSelector() {
      const selector = document.getElementById('componentTypeSelector');
      selector.innerHTML = componentTypes.map(type => `
        <button class="component-type-btn ${selectedComponentType === type ? 'active' : ''}" 
                onclick="selectComponentType('${type}')">
          ${type}
        </button>
      `).join('');
    }

    function selectComponentType(type) {
      selectedComponentType = type;
      renderComponentTypeSelector();
      renderComponentForm(type);
    }

    function renderComponentForm(type) {
      const formContainer = document.getElementById('componentForm');

      let formHTML = '<div>';

      switch (type) {
        case 'text':
          formHTML += `
            <div class="mb-16">
              <label class="qld-text-input-label field-required" for="comp_content">Content</label>
              <input type="text" class="form-control" id="comp_content" placeholder="Text content">
            </div>
          `;
          break;

        case 'html':
          formHTML += `
            <div class="mb-16">
              <label class="qld-text-input-label field-required" for="comp_content">HTML Content</label>
              <textarea class="form-control" id="comp_content" rows="4" placeholder="<p>Your HTML</p>"></textarea>
            </div>
          `;
          break;

        case 'inpage-alert':
          formHTML += `
            <div class="mb-16">
              <label class="qld-text-input-label field-required" for="comp_alertType">Alert Type</label>
              <select class="form-select" id="comp_alertType">
                <option value="info">Info</option>
                <option value="warning">Warning</option>
                <option value="error">Error</option>
                <option value="success">Success</option>
              </select>
            </div>
            <div class="mb-16">
              <label class="qld-text-input-label" for="comp_heading">Heading</label>
              <input type="text" class="form-control" id="comp_heading" placeholder="Alert heading">
            </div>
            <div class="mb-16">
              <label class="qld-text-input-label field-required" for="comp_content">Content</label>
              <textarea class="form-control" id="comp_content" rows="3" placeholder="Alert content"></textarea>
            </div>
          `;
          break;

        case 'button':
          formHTML += `
            <div class="mb-16">
              <label class="qld-text-input-label field-required" for="comp_text">Text</label>
              <input type="text" class="form-control" id="comp_text" placeholder="Button text">
            </div>
            <div class="mb-16">
              <label class="qld-text-input-label field-required" for="comp_link">Link</label>
              <input type="text" class="form-control" id="comp_link" placeholder="/path">
            </div>
            <div class="mb-16">
              <label class="qld-text-input-label" for="comp_variant">Variant</label>
              <select class="form-select" id="comp_variant">
                <option value="primary">Primary</option>
                <option value="secondary">Secondary</option>
                <option value="tertiary">Tertiary</option>
              </select>
            </div>
          `;
          break;

        case 'callout':
          formHTML += `
            <div class="mb-16">
              <label class="qld-text-input-label" for="comp_title">Title</label>
              <input type="text" class="form-control" id="comp_title" placeholder="Callout title">
            </div>
            <div class="mb-16">
              <label class="qld-text-input-label field-required" for="comp_description">Description</label>
              <textarea class="form-control" id="comp_description" rows="3" placeholder="Description"></textarea>
            </div>
          `;
          break;

        case 'image':
          formHTML += `
            <div class="mb-16">
              <label class="qld-text-input-label field-required" for="comp_src">Source URL</label>
              <input type="text" class="form-control" id="comp_src" placeholder="https://example.com/image.jpg">
            </div>
            <div class="mb-16">
              <label class="qld-text-input-label field-required" for="comp_alt">Alt Text</label>
              <input type="text" class="form-control" id="comp_alt" placeholder="Image description">
            </div>
          `;
          break;

        case 'checkbox':
          formHTML += `
            <div class="mb-16">
              <label class="qld-text-input-label field-required" for="comp_id">ID</label>
              <input type="text" class="form-control" id="comp_id" placeholder="field-id">
            </div>
            <div class="mb-16">
              <label class="qld-text-input-label field-required" for="comp_label">Label</label>
              <input type="text" class="form-control" id="comp_label" placeholder="Checkbox label">
            </div>
            <div class="form-check mb-16">
              <input class="form-check-input" type="checkbox" id="comp_required">
              <label class="form-check-label" for="comp_required">Required</label>
            </div>
          `;
          break;

        case 'debug-button':
          formHTML += `
            <div class="alert alert-info" role="alert">
              Debug button has no configuration
            </div>
          `;
          break;

        default:
          formHTML += `
            <div class="alert alert-info" role="alert">
              More fields coming soon for ${type}
            </div>
          `;
      }

      formHTML += `
        <button class="btn btn-primary" onclick="addComponent()">
          Add ${type} to page
        </button>
      </div>`;

      formContainer.innerHTML = formHTML;
    }

    function addComponent() {
      if (currentPageIndex === null || !selectedComponentType) return;

      const component = { type: selectedComponentType };

      // Collect form values
      const inputs = document.querySelectorAll('#componentForm input, #componentForm textarea, #componentForm select');
      inputs.forEach(input => {
        const key = input.id.replace('comp_', '');
        if (input.type === 'checkbox') {
          if (input.checked) component[key] = true;
        } else if (input.value) {
          component[key] = input.value;
        }
      });

      config.pages[currentPageIndex].content.push(component);

      // Reset form
      selectedComponentType = null;
      renderBuilder();
      updateJSON();
    }

    function removeComponent(index) {
      if (currentPageIndex === null) return;
      config.pages[currentPageIndex].content.splice(index, 1);
      renderBuilder();
      updateJSON();
    }

    function renderComponentsList() {
      const container = document.getElementById('componentsList');
      if (!container || currentPageIndex === null) return;

      const components = config.pages[currentPageIndex].content;
      container.innerHTML = components.map((comp, index) => `
        <div class="component-item">
          <div>
            <span class="component-type">${comp.type}</span>
            ${comp.heading || comp.title || comp.text || comp.label || ''}
          </div>
          <button class="btn-close-custom" onclick="removeComponent(${index})">×</button>
        </div>
      `).join('');
    }

    // JSON Output
    function updateJSON() {
      const output = document.getElementById('jsonOutput');
      output.textContent = JSON.stringify(config, null, 2);
    }

    function copyToClipboard() {
      const text = document.getElementById('jsonOutput').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = event.target;
        const originalText = btn.textContent;
        btn.textContent = '✓ Copied!';
        btn.classList.remove('btn-secondary');
        btn.classList.add('btn-primary');
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.remove('btn-primary');
          btn.classList.add('btn-secondary');
        }, 2000);
      });
    }

    // Initialize on load
    init();
  </script>
